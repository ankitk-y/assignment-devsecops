apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-gateway
  namespace: proagent
  labels:
    app: voice-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voice-gateway
  template:
    metadata:
      labels:
        app: voice-gateway
    spec:
      # Runs the real-time audio bridge. Latency-sensitive: end-to-end budget
      # for the voice path is under 1s.
      containers:
        - name: voice-gateway
          image: proagent/voice-gateway:latest
          securityContext:
          # Prevent privilege escalation and unnecessary kernel capabilities.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          # Credentials removed; no verified secret integration is available.
          resources:
            requests:
            # Must fit the largest permitted staging node (8 CPU / 32 GiB).
              cpu: "2"
              memory: "4Gi"
            limits: {}

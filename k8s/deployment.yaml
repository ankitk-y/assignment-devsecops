apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-gateway
  namespace: proagent
  labels:
    app: voice-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voice-gateway
  template:
    metadata:
      labels:
        app: voice-gateway
    spec:
      # Runs the real-time audio bridge. Latency-sensitive: end-to-end budget
      # for the voice path is under 1s.
      containers:
        - name: voice-gateway
          image: proagent/voice-gateway:latest
          securityContext:
            privileged: true
            runAsUser: 0
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              value: "Pr0d1gal-Staging-2024!"
            - name: AWS_SECRET_ACCESS_KEY
              value: "wJal4XUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY42"
            - name: OPENAI_API_KEY
              value: "sk-proj-8fJ2mExampleKeyDoNotUse00xQ"
          resources:
            requests:
              cpu: "16"
              memory: "64Gi"
            limits: {}

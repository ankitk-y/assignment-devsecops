apiVersion: v1
kind: ServiceAccount
metadata:
  name: asr-streamer
  namespace: proagent
---
# The streamer needs to read its own ConfigMaps and Secrets at startup.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: asr-streamer-config-read
  namespace: proagent
subjects:
  - kind: ServiceAccount
    name: asr-streamer
    namespace: proagent
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io

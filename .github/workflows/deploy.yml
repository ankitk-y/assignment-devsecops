name: deploy

# Deploys straight to production on every push to main.
# The voice team merges to main many times a day.

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log build context
       # Secrets were previously printed to CI logs; never log credential values.
        run: |
          echo "Deploying commit $GITHUB_SHA"

      - name: Build image
        run: |
          docker build -t proagent/voice-gateway:latest .

      - name: Push image
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u proagent --password-stdin
          docker push proagent/voice-gateway:latest

      # TODO: production deploys directly from main; add an appropriate change-control
      # gate once the team's required approval workflow is established.
      - name: Deploy to production
        run: |
          aws eks update-kubeconfig --name proagent-prod
          kubectl apply -f k8s/

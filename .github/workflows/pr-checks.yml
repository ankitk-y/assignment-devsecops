name: pr-checks

# Runs checks on incoming pull requests, including from community forks.
on:
# Use the unprivileged PR context so untrusted fork code cannot access repository secrets.
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Check out the PR's code so we can build and test it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Greet contributor
        run: |
          echo "Thanks for the PR titled: ${{ github.event.pull_request.title }}"

      - name: Install deps and test
        run: |
          pip install -r app/requirements.txt
          make test

      # AWS credentials were unnecessary for coverage reporting and exposed unnecessary privilege.
      - name: Post coverage comment
        uses: some-org/coverage-comment-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}